pg_stat_statements:
  query: |
    SELECT
      pg_database.datname AS datname,
      rolname,
      queryid,
      calls,
      total_exec_time/1000 as total_time_seconds,
      mean_exec_time/1000 as mean_time_seconds
    FROM pg_stat_statements
    JOIN pg_roles ON pg_roles.oid = pg_stat_statements.userid
    JOIN pg_database ON pg_database.oid = pg_stat_statements.dbid;
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - rolname:
        usage: "LABEL"
        description: "Role name"
    - queryid:
        usage: "LABEL"
        description: "Query ID"
    - calls:
        usage: "COUNTER"
        description: "Number of times query executed"
    - total_time_seconds:
        usage: "COUNTER"
        description: "Total execution time of query"
    - mean_time_seconds:
        usage: "GAUGE"
        description: "Average execution time of query"
